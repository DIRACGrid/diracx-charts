kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane

  extraMounts:
  # Mount the directories in the control plane
  # Then the PV will mount it from this control plane "local" directory
  - hostPath: {{ csStorePath }}
    containerPath: /local_cs_store
{{ extraMounts }}

  # Expose auxiliary demo services; Envoy publishes HTTPS port 8000 separately.
  extraPortMappings:
  # SeaweedFS
  - containerPort: 32000
    hostPort: 32000
    protocol: TCP
  # SeaweedFS AdminUI
  - containerPort: 32001
    hostPort: 32001
    protocol: TCP
  # Dex web interface
  - containerPort: 32002
    hostPort: 32002
    protocol: TCP
  # IAM
  - containerPort: 32003
    hostPort: 32003
    protocol: TCP
  # Grafana web interface (OpenTelemetry)
  - containerPort: 32004
    hostPort: 32004
    protocol: TCP
