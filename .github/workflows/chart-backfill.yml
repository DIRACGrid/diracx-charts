name: Chart backfill

# One-off: copies the chart versions of https://charts.diracgrid.org to ghcr.io.
# Run it once from master after the first chart is published there, then delete
# this workflow and .github/scripts/backfill_charts_oci.sh.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    name: backfill
    if: github.repository == 'DIRACGrid/diracx-charts' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push the charts to ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Copy the published charts to ghcr.io
        env:
          REGISTRY: ghcr.io/diracgrid/diracx-charts
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/backfill_charts_oci.sh
