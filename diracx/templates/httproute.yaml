{{- if .Values.gateway.enabled }}
{{- $fullName := include "diracx.fullname" . }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "diracx.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $fullName }}
      sectionName: https
  hostnames:
    - {{ required "diracx.hostname must be set!" .Values.diracx.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /.well-known
      backendRefs:
        - name: {{ $fullName }}
          port: {{ .Values.diracx.service.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $fullName }}-web
          port: {{ .Values.diracxWeb.service.port }}
{{- end }}
