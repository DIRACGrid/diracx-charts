{{- if .Values.testDatabases.mariadb.enabled }}
# Empty MariaDB server, only used by the diracx unit tests (which create their
# own databases in it). Nothing in DiracX itself connects to it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-test-mariadb
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/component: test-database
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mariadb
      app.kubernetes.io/component: test-database
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mariadb
        app.kubernetes.io/component: test-database
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: mariadb
          image: "{{ .Values.testDatabases.mariadb.image.repository }}:{{ .Values.testDatabases.mariadb.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.testDatabases.mariadb.existingSecret }}
                  key: mariadb-root-password
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        # The test databases are throwaway, no need to persist them
        - name: data
          emptyDir: {}
{{- end }}
