{{- if .Values.testDatabases.mariadb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-test-mariadb
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/component: test-database
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP
  selector:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/component: test-database
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
